
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1262d6">

  <title>Login — CPOVERIFY</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

  <!-- BRAND -->
  <a class="brand auth-brand" href="index.html">
    <span class="brand-mark">✓</span>

    <span>
      <b>CPO<span>VERIFY</span></b>
      <small>Verify. Connect. Trust.</small>
    </span>
  </a>

  <!-- LOGIN -->
  <main class="auth-card">

    <h1>Welcome back</h1>

    <p class="muted">
      Log in to your CPOVERIFY account.
    </p>

    <form id="login-form">

      <label for="login-email">
        Email address

        <input
          type="email"
          id="login-email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </label>

      <label for="login-password">
        Password

        <input
          type="password"
          id="login-password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </label>

      <div class="form-row">
        <a href="forgot-password.html">
          Forgot password?
        </a>
      </div>

      <button
        class="btn full"
        id="login-button"
        type="submit"
      >
        Log in
      </button>

      <p
        id="login-status"
        class="muted"
        role="status"
        aria-live="polite"
      ></p>

    </form>

    <p class="auth-foot">
      Don't have an account?
      <a href="register.html">Create one</a>
    </p>

    <p class="auth-foot">
      <a href="index.html">← Back to home</a>
    </p>

  </main>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- SHARED CPOVERIFY JAVASCRIPT -->
  <script src="app.js"></script>

  <!-- LOGIN PAGE HANDLER -->
  <script>
    (function () {

      const form = document.getElementById("login-form");
      const button = document.getElementById("login-button");
      const status = document.getElementById("login-status");

      form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email = document
          .getElementById("login-email")
          .value
          .trim();

        const password = document
          .getElementById("login-password")
          .value;

        button.disabled = true;

        status.textContent = "Signing in...";
        status.style.color = "";

        try {

          const result =
            await firebase.auth().signInWithEmailAndPassword(
              email,
              password
            );

          status.textContent = "Login successful.";

          await redirectUser(result.user);

        } catch (error) {

          console.error("Login error:", error);

          if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
          ) {

            status.textContent =
              "Incorrect email or password.";

          } else if (
            error.code === "auth/invalid-email"
          ) {

            status.textContent =
              "Please enter a valid email address.";

          } else if (
            error.code === "auth/too-many-requests"
          ) {

            status.textContent =
              "Too many attempts. Please try again later.";

          } else {

            status.textContent =
              "Login failed. Please check your connection and try again.";

          }

          status.style.color = "#c62828";

        } finally {

          button.disabled = false;

        }

      });

    })();
  </script>

</body>
</html>
