<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Create Account — CPOVERIFY</title> <link rel="stylesheet" href="styles.css"> </head> <body class="auth-page"> <a class="brand auth-brand" href="index.html"> <span class="brand-mark">✓</span> <span> <b>CPO<span>VERIFY</span></b> <small>Verify. Connect. Trust.</small> </span> </a> <main class="auth-card"> <h1>Create account</h1> <p class="muted">Join CPOVERIFY today.</p> <form id="register-form"> <label> Full name <input type="text" id="register-name" placeholder="Enter your full name" required> </label> <label> Email address <input type="email" id="register-email" placeholder="you@example.com" required> </label> <label> Password <input type="password" id="register-password" placeholder="Create a password" minlength="8" required> </label> <label> Confirm password <input type="password" id="register-confirm" placeholder="Confirm your password" minlength="8" required> </label> <button class="btn full" type="submit"> Create account </button> <button class="btn btn-google full" type="button" data-google-demo> Continue with Google </button> </form> <p class="auth-foot"> Already have an account? <a href="login.html">Log in</a> </p> <p class="auth-foot"> <a href="index.html">← Back to home</a> </p> </main> <!-- Firebase SDK --> <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script> <script> const firebaseConfig = { apiKey: "AIzaSyAS25JvO0dNVZmxw7rV9O-Pgcb_bdmj-A0", authDomain: "cpoverify.firebaseapp.com", projectId: "cpoverify", storageBucket: "cpoverify.firebasestorage.app", messagingSenderId: "981815301734", appId: "1:981815301734:web:1f5890fa643c2c3f37bfa7", measurementId: "G-MVC4EHLQ1Z" }; firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const form = document.getElementById("register-form"); form.addEventListener("submit", async function(event) { event.preventDefault(); const name = document.getElementById("register-name").value.trim(); const email = document.getElementById("register-email").value.trim(); const password = document.getElementById("register-password").value; const confirmPassword = document.getElementById("register-confirm").value; if (password !== confirmPassword) { alert("Your passwords do not match."); return; } try { const result = await auth.createUserWithEmailAndPassword( email, password ); await result.user.updateProfile({ displayName: name }); alert("Account created successfully!"); window.location.href = "dashboard.html"; } catch (error) { console.error(error); alert( error.message || "Registration failed. Please try again." ); } }); </script> <script src="app.js"></script> </body> </html>
