
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — CPOVERIFY</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <a class="brand auth-brand" href="index.html">
    <span class="brand-mark">✓</span>
    <span>
      <b>CPO<span>VERIFY</span></b>
      <small>Verify. Connect. Trust.</small>
    </span>
  </a>

  <main class="auth-card">
    <h1>Forgot password?</h1>
    <p class="muted">
      Enter your email address to request a password reset.
    </p>

    <form data-demo-form
      data-success="Demo request submitted. Configure an authentication provider to send real reset emails.">

      <label>
        Email address
        <input type="email" name="email"
          placeholder="you@example.com" required>
      </label>

      <button class="btn full" type="submit">
        Send reset link
      </button>
    </form>

    <p class="auth-foot">
      Remembered your password?
      <a href="login.html">Log in</a>
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
