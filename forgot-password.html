
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — CPOVERIFY</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

  <a class="brand auth-brand" href="index.html">
    <span class="brand-mark">✓</span>
    <span>
      <b>CPO<span>VERIFY</span></b>
      <small>Verify. Connect. Trust.</small>
    </span>
  </a>

  <main class="auth-card">
    <h1>Forgot password?</h1>
    <p class="muted">
      Enter your email address to receive a password reset link.
    </p>

    <form id="forgot-password-form">
      <label for="reset-email">
        Email address
        <input
          type="email"
          id="reset-email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </label>

      <button class="btn full" id="reset-button" type="submit">
        Send reset link
      </button>

      <p id="reset-status" class="muted" role="status" aria-live="polite"></p>
    </form>

    <p class="auth-foot">
      Remembered your password?
      <a href="login.html">Log in</a>
    </p>

    <p class="auth-foot">
      <a href="index.html">← Back to home</a>
    </p>
  </main>

  <!-- Firebase SDKs must load before app.js -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="app.js"></script>

  <script>
    (function () {
      const form = document.getElementById("forgot-password-form");
      const emailInput = document.getElementById("reset-email");
      const button = document.getElementById("reset-button");
      const status = document.getElementById("reset-status");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
          status.textContent = "Please enter your email address.";
          return;
        }

        button.disabled = true;
        status.textContent = "Sending reset link...";
        status.style.color = "";

        try {
          await firebase.auth().sendPasswordResetEmail(email);

          status.textContent =
            "If an account exists for that email, a password reset email has been requested. Check your inbox and spam folder.";

          status.style.color = "#16803d";
          form.reset();
        } catch (error) {
          console.error("Password reset error:", error);

          // Avoid revealing whether an email address has an account.
          if (
            error.code === "auth/invalid-email" ||
            error.code === "auth/missing-email"
          ) {
            status.textContent = "Please enter a valid email address.";
          } else {
            status.textContent =
              "We couldn't process the reset request right now. Please check your connection and try again.";
          }

          status.style.color = "#c62828";
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>

</body>
</html>
