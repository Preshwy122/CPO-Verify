pan>↗</span>Boosting</a> <a class="active" href="profile.html"><span>◎</span>Profiles</a> </nav> <!-- Firebase SDK --> <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script> <!-- Shared CPOVERIFY JavaScript --> <script src="app.js"></script> <script> const profileStatus = document.getElementById("profile-status"); const profileName = document.getElementById("profile-name"); const profileAvatar = document.getElementById("profile-avatar"); const displayNameInput = document.getElementById("profile-display-name"); const emailInput = document.getElementById("profile-email"); const uidInput = document.getElementById("profile-uid"); const accountId = document.getElementById("account-id"); const saveButton = document.getElementById("save-profile"); const passwordButton = document.getElementById("change-password"); // Check Firebase authentication firebase.auth().onAuthStateChanged(async function(user) { if (!user) { window.location.href = "login.html"; return; } // Show real user information const name = user.displayName || user.email || "CPOVERIFY User"; profileName.textContent = name; profileAvatar.textContent = name.charAt(0).toUpperCase(); displayNameInput.value = user.displayName || ""; emailInput.value = user.email || ""; uidInput.value = user.uid; accountId.textContent = user.uid; profileStatus.textContent = "Your profile is connected to Firebase Authentication."; }); // Save display name saveButton.addEventListener("click", async function() { const user = firebase.auth().currentUser; if (!user) { window.location.href = "login.html"; return; } const newName = displayNameInput.value.trim(); if (!newName) { alert("Please enter your display name."); return; } saveButton.disabled = true; try { await user.updateProfile({ displayName: newName }); profileName.textContent = newName; profileAvatar.textContent = newName.charAt(0).toUpperCase(); profileStatus.textContent = "Your profile has been updated."; alert("Profile updated successfully!"); } catch (error) { console.error("Profile update error:", error); alert( error.message || "Unable to update your profile." ); } finally { saveButton.disabled = false; } }); // Change password passwordButton.addEventListener("click", function() { const user = firebase.auth().currentUser; if (!user || !user.email) { alert("Please sign in again."); return; } window.location.href = "forgot-password.html"; }); </script> </body> </html>
